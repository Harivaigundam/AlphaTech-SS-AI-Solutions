<header class="header" [class.scrolled]="isScrolled">
  <div class="header-inner container">
    <a routerLink="/" class="logo">
      <div class="logo-mark">AT</div>
      <span class="logo-text">Alpha Tech</span>
    </a>

    <nav class="nav" [class.open]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link" (click)="closeMenu()">Home</a>
      <a routerLink="/services" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Services</a>
      <a routerLink="/solutions" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Solutions</a>
      <a routerLink="/process" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Process</a>
    </nav>

    <div class="header-actions">
      <a href="/#contact" class="btn-primary btn-sm" (click)="scrollToContact($event)">Contact</a>
      <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'">
        <span class="menu-line" [class.open]="menuOpen"></span>
        <span class="menu-line" [class.open]="menuOpen"></span>
      </button>
    </div>
  </div>
</header>
