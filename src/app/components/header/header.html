<header class="header" [class.scrolled]="isScrolled">
  <div class="header-inner container">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <div class="logo-mark">AT</div>
      <span class="logo-text">Alpha Tech</span>
    </a>

    <nav class="nav-desktop">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
      <a routerLink="/services" routerLinkActive="active" class="nav-link">Services</a>
      <a routerLink="/solutions" routerLinkActive="active" class="nav-link">Solutions</a>
      <a routerLink="/process" routerLinkActive="active" class="nav-link">Process</a>
    </nav>

    <div class="header-actions">
      <a href="/#contact" class="btn-primary btn-sm" (click)="scrollToContact($event)">Contact</a>
      <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'" [class.open]="menuOpen">
        <span class="menu-line"></span>
        <span class="menu-line"></span>
        <span class="menu-line"></span>
      </button>
    </div>
  </div>
</header>

<!-- Mobile Navigation Overlay -->
<div class="mobile-nav-overlay" [class.open]="menuOpen" (click)="closeMenu()">
  <div class="mobile-nav-backdrop"></div>
  <nav class="mobile-nav" (click)="$event.stopPropagation()">
    <div class="mobile-nav-header">
      <a routerLink="/" class="logo" (click)="closeMenu()">
        <div class="logo-mark">AT</div>
        <span class="logo-text">Alpha Tech</span>
      </a>
      <button class="mobile-close-btn" (click)="closeMenu()" aria-label="Close menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="mobile-nav-content">
      <div class="mobile-nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="mobile-nav-link" (click)="closeMenu()" [style.--delay]="0">
          <span class="mobile-nav-link-text">Home</span>
          <span class="mobile-nav-link-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </span>
        </a>
        <a routerLink="/services" routerLinkActive="active" class="mobile-nav-link" (click)="closeMenu()" [style.--delay]="1">
          <span class="mobile-nav-link-text">Services</span>
          <span class="mobile-nav-link-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </span>
        </a>
        <a routerLink="/solutions" routerLinkActive="active" class="mobile-nav-link" (click)="closeMenu()" [style.--delay]="2">
          <span class="mobile-nav-link-text">Solutions</span>
          <span class="mobile-nav-link-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </span>
        </a>
        <a routerLink="/process" routerLinkActive="active" class="mobile-nav-link" (click)="closeMenu()" [style.--delay]="3">
          <span class="mobile-nav-link-text">Process</span>
          <span class="mobile-nav-link-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </span>
        </a>
      </div>

      <div class="mobile-nav-footer">
        <a href="/#contact" class="mobile-cta-btn" (click)="scrollToContact($event)">
          <span>Start a Project</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
        <div class="mobile-nav-meta">
          <span class="mobile-nav-status">
            <span class="status-dot"></span>
            Available for new projects
          </span>
        </div>
      </div>
    </div>
  </nav>
</div>

<!-- Mobile Bottom Navigation -->
<nav class="mobile-bottom-nav" [class.hidden]="menuOpen">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="bottom-nav-item" (click)="closeMenu()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <span>Home</span>
  </a>
  <a routerLink="/services" routerLinkActive="active" class="bottom-nav-item" (click)="closeMenu()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
      <path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/>
    </svg>
    <span>Services</span>
  </a>
  <a routerLink="/solutions" routerLinkActive="active" class="bottom-nav-item" (click)="closeMenu()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 16v-4M12 8h.01"/>
    </svg>
    <span>Solutions</span>
  </a>
  <a routerLink="/process" routerLinkActive="active" class="bottom-nav-item" (click)="closeMenu()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    <span>Process</span>
  </a>
</nav>
